name: Auto-Sync Intervals.icu Data

on:
  schedule:
  - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run sync
        env:
          ATHLETE_ID: ${{ secrets.ATHLETE_ID }}
          INTERVALS_KEY: ${{ secrets.INTERVALS_KEY }}
        run: |
          python sync.py \
            --athlete-id "$ATHLETE_ID" \
            --intervals-key "$INTERVALS_KEY" \
            --days 7 \
            --output latest.json

      - name: Commit and push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add latest.json
          [ -f history.json ] && git add history.json || true
          [ -f ftp_history.json ] && git add ftp_history.json || true
          [ -f intervals.json ] && git add intervals.json || true
          [ -f routes.json ] && git add routes.json || true
          git diff --staged --quiet || git commit -m "Sync $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Purge jsDelivr cache
        run: |
          curl -s "https://purge.jsdelivr.net/gh/mmmgame1888/my-training-data@main/latest.json"
          curl -s "https://purge.jsdelivr.net/gh/mmmgame1888/my-training-data/latest.json"
          sleep 5
          echo "✅ jsDelivr cache purged"
